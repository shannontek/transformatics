name: Deploy textbook to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: Textbook checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            textbook/requirements.txt
            tests/requirements.txt

      - name: Install the book and test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --requirement textbook/requirements.txt \
            --requirement tests/requirements.txt

      - name: Build the textbook with link, claim and source-hash checks
        run: python scripts/build_textbook.py

      - name: Check the publication inventory
        run: python -m pytest -q tests/test_publication_inventory.py

      - name: Run the fluid simulator self-tests
        run: node textbook/assets/fluid/checks.js

  build:
    name: Build the static site
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: textbook/requirements.txt

      - name: Install the book dependency
        run: |
          python -m pip install --disable-pip-version-check \
            --requirement textbook/requirements.txt

      - name: Build the textbook
        run: python scripts/build_textbook.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: textbook/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
